apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-sts
  labels: 
    app: sts
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sts
  template:
    metadata:
      labels:
        app: sts
    spec:
      containers:
      - name: cont-11
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
          - mountPath: /opt
            name: my-pvc
      volumes: 
      - name: my-pvc
        persistentVolumeClaim:
          claimName: my-pvc      
