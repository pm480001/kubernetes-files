apiVersion: apps/v1
kind: Deployment 
metadata:
  name: my-deploy
  labels:
    app: nginx
spec:
  replicas: 3
  selector: 
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      -  name: nginx
         image: nginx
         ports: 
         - containerPort: 80
         resources:
           limits:
             cpu: 15m 
           requests:
             cpu: 10m 
  strategy:
    type: Recreate    
